<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agenite · 本地智能体</title>
  <link rel="stylesheet" href="./src/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="brand"><span class="logo">🤖</span> Agenite</div>
      <button id="new-chat" class="primary">+ 新对话</button>
      <div id="conv-list"></div>
      <div class="sidebar-foot">
        <button id="open-settings" title="设置">⚙ 设置</button>
        <span id="conn-status" class="dot" title="连接状态"></span>
      </div>
    </aside>

    <main id="main">
      <header id="topbar">
        <div id="chat-title">新对话</div>
        <div class="top-actions">
          <button id="agent-toggle" class="chip active" title="工具调用 Agent">🛠 Agent</button>
          <button id="theme-toggle" title="切换主题">🌙</button>
          <button id="clear-chat" title="清空当前对话">🗑</button>
        </div>
      </header>

      <div id="messages"></div>

      <div id="composer">
        <textarea id="input" placeholder="输入消息…（Enter 发送，Shift+Enter 换行；开启 Agent 后可让它联网/读写文件）" rows="2"></textarea>
        <div class="composer-actions">
          <span id="model-label" class="muted"></span>
          <button id="send" class="primary">发送</button>
          <button id="stop" class="hidden" title="停止生成">■ 停止</button>
        </div>
      </div>
    </main>
  </div>

  <div id="settings-modal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head">
        <h2>设置</h2>
        <button id="close-settings" class="icon">✕</button>
      </div>
      <p class="muted small">配置仅保存在你本地浏览器 (localStorage)，不会上传。API Key 通过本地代理发送至对应运营商。</p>
      <div class="form">
        <label>供应商
          <select id="set-provider"></select>
        </label>
        <label>Base URL
          <input id="set-baseURL" type="text" placeholder="https://..." />
        </label>
        <label>API Key
          <input id="set-apiKey" type="password" placeholder="sk-..." autocomplete="off" />
        </label>
        <label>模型名称 (model)
          <input id="set-model" type="text" placeholder="deepseek-chat" />
        </label>
        <div class="row">
          <label>温度 (temperature): <span id="temp-val">0.7</span>
            <input id="set-temperature" type="range" min="0" max="2" step="0.05" value="0.7" />
          </label>
          <label>最大 Token
            <input id="set-maxTokens" type="number" min="1" max="128000" value="2048" />
          </label>
        </div>
        <label class="check">
          <input id="set-agentEnabled" type="checkbox" checked /> 启用 Agent（工具调用）
        </label>
        <label class="check danger">
          <input id="set-dangerTools" type="checkbox" /> 启用高级工具（写文件 / 执行命令）— 有风险
        </label>
      </div>
      <div class="modal-foot">
        <button id="test-conn" class="ghost">测试连接</button>
        <button id="save-settings" class="primary">保存</button>
      </div>
      <div id="settings-msg" class="muted small"></div>
    </div>
  </div>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
