name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Skip the real-browser smoke test and its worker teardown — CI has no Chrome.
env:
  AGENITE_SKIP_CHROME: "1"

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run tests
        run: npm test
      - name: Build single-file artifact
        run: npm run build
