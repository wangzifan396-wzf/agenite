name: Feature request
description: 提出一个新功能 / Suggest a feature
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题 / Problem
      description: 这个需求解决什么痛点？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案 / Proposal
      description: 你希望怎样实现？
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 补充说明 / Additional context
