name: Bug report
description: 报告一个问题 / Report a bug
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: 问题描述 / What happened
      description: 清晰描述你遇到的现象。
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤 / Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: 供应商 / Provider
      placeholder: DeepSeek / OpenAI / Qwen / ...
  - type: input
    id: node
    attributes:
      label: Node 版本 / Node version
      placeholder: "22.22.2"
  - type: textarea
    id: logs
    attributes:
      label: 日志 / Logs
      description: 服务端终端或浏览器控制台的报错。**请勿粘贴真实 API Key。**
